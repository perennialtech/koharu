name: Container image

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Set up the Cargo cache
        id: cargo-cache
        run: |
          cache_dir="$RUNNER_TEMP/koharu-oci"
          mkdir -p "$cache_dir"
          echo "CARGO_HOME=$cache_dir/cargo" >> "$GITHUB_ENV"
          echo "dir=$cache_dir" >> "$GITHUB_OUTPUT"
          echo "target=$(realpath --relative-to="$GITHUB_WORKSPACE" "$cache_dir/target")" >> "$GITHUB_OUTPUT"
          image=$(awk '$1 == "FROM" && $4 == "builder" {print $2}' Containerfile)
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: ${{ steps.cargo-cache.outputs.image-digest }}-${{ hashFiles('Containerfile') }}
          workspaces: . -> ${{ steps.cargo-cache.outputs.target }}
          cache-bin: false
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          build-contexts: cargo-cache=${{ steps.cargo-cache.outputs.dir }}
          build-args: EXPORT_CARGO_CACHE=${{ steps.rust-cache.outputs.cache-hit != 'true' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Export the Cargo cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          target: cache-export
          build-contexts: cargo-cache=${{ steps.cargo-cache.outputs.dir }}
          build-args: EXPORT_CARGO_CACHE=true
          outputs: type=local,dest=${{ steps.cargo-cache.outputs.dir }}
