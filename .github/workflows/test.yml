name: Test

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Debug info roughly doubles the cache and link times; CI never reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check.sh lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # The build needs nothing beyond the runner image. Vulkan and the CJK
      # fonts are only needed to run the tests, so install them while the
      # tests build.
      - name: Start installing test packages
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          status="$RUNNER_TEMP/apt.status"
          echo "APT_STATUS=$status" >> "$GITHUB_ENV"
          nohup sh -c '
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq --no-install-recommends \
              libfontconfig1 libvulkan1 mesa-vulkan-drivers fonts-noto-cjk
            echo $? > "$0"
          ' "$status" > "$RUNNER_TEMP/apt.log" 2>&1 &
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test --workspace --tests --no-run
      - name: Wait for test packages
        run: |
          while [ ! -f "$APT_STATUS" ]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$APT_STATUS")"
      - run: ./scripts/check.sh test
