name: Test

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            build-essential \
            libfontconfig-dev \
            fonts-noto-cjk
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run headless Rust tests
        run: |
          cargo test --workspace --tests

