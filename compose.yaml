services:
  koharu:
    image: ghcr.io/perennialtech/koharu:latest
    build:
      context: .
      dockerfile: Containerfile
    gpus: all
    ports:
      - 127.0.0.1:8080:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    volumes:
      - koharu-cache:/var/cache/koharu
    environment:
      - KOHARU_TRANSLATORS
      - KOHARU_INPAINTING
      - KOHARU_DEEPLX_BASE_URL
      - KOHARU_OPENAI_COMPATIBLE_BASE_URL
      - KOHARU_OPENAI_COMPATIBLE_MODEL
      - KOHARU_OPENROUTER_MODEL
      - KOHARU_AZURE_REGION
      - DEEPL_API_KEY
      - GOOGLE_CLOUD_TRANSLATION_API_KEY
      - AZURE_TRANSLATOR_KEY
      - OPENROUTER_API_KEY
      - OPENAI_COMPATIBLE_API_KEY

  # Uncomment to run DeepLX on the Compose network without publishing a port.
  # Set KOHARU_DEEPLX_BASE_URL=http://deeplx:1188 in the host environment.
  # deeplx:
  #   image: ghcr.io/owo-network/deeplx:v1.3.1
  #   read_only: true
  #   cap_drop:
  #     - ALL
  #   security_opt:
  #     - no-new-privileges:true
  #   tmpfs:
  #     - /tmp:rw,nosuid,nodev

volumes:
  koharu-cache:
    name: koharu-cache
