[package]
name = "koharu-server"
version.workspace = true
edition.workspace = true
description = "Lean HTTP image translation service for Koharu."
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
clap = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
koharu-config = { workspace = true }
koharu-ml = { workspace = true }
koharu-pipeline = { workspace = true }
koharu-rasterizer = { workspace = true, features = ["native"] }
koharu-renderer = { workspace = true }
koharu-scene = { workspace = true }
koharu-translator = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["axum", "vendored"] }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
